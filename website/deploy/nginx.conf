server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;

    root /usr/share/nginx/html;

    # 裸域归 free-hire（HR 项目）：受信证书上线后浏览器把 http://IP 自动升级
    # 到 https://IP，裸 IP 回不去 HR——把未占用路径整体反代回 HR 的 :80，
    # 恢复"打开 IP 就是 HR"的老行为。本站入口仍是 /sgp/。
    # /hronfire 只是跳转别名：HR 的 SPA basename 是 /，挂子路径会坏路由。
    location = /hronfire { return 302 /; }
    location / {
        proxy_pass http://172.17.0.1:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $sgp_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 50m;
    }

    # 鈥斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€?浜戠妯℃嫙鍣紙sgp-emu 瀹瑰櫒锛夆€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€?
    # Host/Origin 鏀瑰啓鎴愭湰鏈哄洖鐜細绛変环 vite 浠ｇ悊鐨?changeOrigin锛?
    # 妯℃嫙鍣ㄧ殑 entry-guard 鎶婂弽浠ｈ姹傝浣?鏈珯椤甸潰"锛岃法婧愰〉闈粛浼氳鎷掋€?

    # SSE 浜嬩欢娴?/ 鎸夐敭 / 鐢垫簮 / 鏃堕棿鎺у埗鈥斺€旈暱杩炴帴锛屽叧鎺夌紦鍐蹭笌瓒呮椂
    location /_emu/ {
        proxy_pass http://sgp-emu:8642;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8640;
        proxy_set_header Origin http://127.0.0.1:8640;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # 璁惧 HTTP API锛堝簲鐢ㄨ/鍚?鍒犮€佸睆骞曠粯鍒垛€︼級
    # 只认领模拟器固件的 15 个前缀（grep 自 emu-image，换模拟器版本要重核）；
    # 其余 /api/* 全部透传给 free-hire 后端（497 条路由，随时在长）
    location ~ ^/api/(access|apps|assets|audio|busy|display|input|log_dump|screen|status|storage|time|update|version|wifi)(/|$) {
        proxy_pass http://sgp-emu:8642;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8640;
        proxy_set_header Origin http://127.0.0.1:8640;
        proxy_set_header Connection "";
    }
    location /api/ {
        proxy_pass http://172.17.0.1:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 50m;
    }

    # 妯℃嫙鍣ㄨ嚜韬殑 API 鏂囨。椤?
    location /docs {
        proxy_pass http://sgp-emu:8642;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8640;
        proxy_set_header Origin http://127.0.0.1:8640;
        proxy_set_header Connection "";
    }

    # 妯℃嫙鍣ㄥ唴缃澶囩獥鍙ｉ〉锛堝鐢ㄥ叆鍙ｏ紱涓荤獥鍙ｆ槸 /sgp/emulator/ 闈欐€佸畾鍒剁増锛?
    location /emulator/ {
        proxy_pass http://sgp-emu:8642;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8640;
        proxy_set_header Origin http://127.0.0.1:8640;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # 3D 瑙嗗浘鐨?frame 闈欐€佹枃浠舵寜闇€鍥炴簮鍒版ā鎷熷櫒锛堟湰鐩綍鍦ㄩ潤鎬佺珯閲屼笉瀛樺湪鏃讹級
    location /sgp/emulator/stage3d/ {
        try_files $uri @emu-stage3d;
    }
    location @emu-stage3d {
        rewrite ^/sgp/(.*)$ /$1 break;
        proxy_pass http://sgp-emu:8642;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8640;
        proxy_set_header Origin http://127.0.0.1:8640;
        proxy_set_header Connection "";
    }

    # /emu-shell 娴忚鍣ㄥ伐鍏锋ˉ锛圢DJSON 娴佸紡鍝嶅簲锛夆啋 emu-shell-server.mjs :8641
    location /emu-shell/ {
        proxy_pass http://sgp-emu:8641/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 600s;
        client_max_body_size 16m;
    }
    location = /emu-shell {
        return 308 /emu-shell/ping;
    }

    # /hub 共享看板 presence 服务（成员状态发布/订阅，与固件 MQTT 同模型）→ presence-server.mjs :8643
    location /hub/ {
        proxy_pass http://sgp-emu:8643/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }
    location = /hub {
        return 308 /hub/ping;
    }
    # 鈥斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€斺€?

    # /sgp/product 鏄?SPA 璺敱锛屽悓鏃?/sgp/product/ 鍙堟槸闈欐€佽祫婧愮洰褰曪細
    # 绮剧‘鍖归厤鐩存帴鍠?index.html锛岄伩寮€鐩綍鏂滄潬閲嶅畾鍚戝舰鎴愮殑寰幆
    location = /sgp/product  { try_files /sgp/index.html =404; }
    location = /sgp/product/ { return 301 /sgp/product; }

    location /sgp/ {
        index index.html;
        try_files $uri $uri/ /sgp/index.html;
    }
}

# ---- free-hire（HR 项目）专属域名入口 ----
# Chrome 会把 http://IP 自动升级到 https://IP（本站），裸 IP 已回不去 HR；
# 给 HR 一个独立域名 origin，它的 /api、/assets、SPA 路由全部原样工作。
# 反代目标是宿主机发布的 :80（docker0 网关 172.17.0.1），不碰 free-hire 容器。
map $http_upgrade $sgp_connection_upgrade {
    default upgrade;
    ''      close;
}
server {
    listen 443 ssl;
    server_name hr.120.55.125.13.sslip.io;

    ssl_certificate     /etc/nginx/tls/hr-cert.pem;
    ssl_certificate_key /etc/nginx/tls/hr-key.pem;

    location / {
        proxy_pass http://172.17.0.1:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # AI 面试 SSE / WebSocket 长连接
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $sgp_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 50m;
    }
}
